[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cumulus-vault"
version = "0.2.0"
description = "Encrypted, verifiable backups to Filecoin for small organizations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Infinitum Corporation" }]
dependencies = ["cryptography>=42", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cvault = "cumulus_vault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
